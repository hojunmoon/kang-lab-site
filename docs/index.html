<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kang Lab — Yeungnam University</title>
<meta name="description" content="영남대학교 화학과 강미숙 교수 연구실 — 차세대 이차전지 및 광촉매 소재 연구" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <dl class="stats" id="stats">
      <div class="stat">
        <dt>Citations</dt>
        <dd id="stat-citedby">—</dd>
      </div>
      <div class="stat">
        <dt>h-index</dt>
        <dd id="stat-hindex">—</dd>
      </div>
      <div class="stat">
        <dt>i10-index</dt>
        <dd id="stat-i10index">—</dd>
      </div>
    </dl>
  </header>

  <main class="pubs">
    <div class="pubs__head">
      <h2>Publications</h2>
      <div class="pubs__controls">
        <label class="search">
          <span>검색</span>
          <input type="search" id="search-input" placeholder="제목으로 검색…" />
        </label>
        <label class="filter">
          <span>연도</span>
          <select id="year-filter">
            <option value="all">전체</option>
          </select>
        </label>
      </div>
    </div>

    <div id="pubs-list" class="pubs__list" aria-live="polite">
      <p class="pubs__loading">불러오는 중…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p id="updated-line">마지막 업데이트 확인 중…</p>
    <a id="scholar-link" href="https://scholar.google.com/citations?user=JHrp3gcAAAAJ" target="_blank" rel="noopener">Google Scholar 프로필 전체 보기 →</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
